name: Refresh sitemap

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sitemap-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check out the deployed branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Request static site rebuild if configured
        env:
          INTIMORA_SITEMAP_DEPLOY_HOOK_URL: ${{ secrets.INTIMORA_SITEMAP_DEPLOY_HOOK_URL }}
        run: node scripts/request-sitemap-refresh.mjs
