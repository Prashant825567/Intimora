name: Refresh anime feed

# The baked anime rows are written during the build, so they are only as fresh as
# the last deploy. This asks Render for a rebuild every hour, which re-reads the
# source's listings and re-writes the feed — the closest thing to live data that
# needs no proxy and no request from a visitor's browser. It uses the same deploy
# hook as the sitemap job: one service, one hook.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anime-feed-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check out the deployed branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Request a rebuild so the feed is re-baked
        env:
          INTIMORA_SITEMAP_DEPLOY_HOOK_URL: ${{ secrets.INTIMORA_SITEMAP_DEPLOY_HOOK_URL }}
        run: node scripts/request-sitemap-refresh.mjs
