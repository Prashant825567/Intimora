services:
  - type: web
    name: intimora
    runtime: node
    branch: master
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      # Supply this privately in Render; it must not have a VITE_ prefix.
      - key: API_DISCOVERY_URL
        sync: false
      - key: PROXY_TOKEN_SECRET
        generateValue: true
